import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.internal.operations.BuildOperationListener
import org.gradle.internal.operations.BuildOperationListenerManager
import java.security.MessageDigest

assert gradle.gradleVersion == '8.14.2'
def request = new JsonSlurper().parse(new File(System.getProperty('ktlsp.java.producer.request')))
assert request.schema == 1
def rawSelectedSources = request.sources.collect { it.private }.toSet()
def selectedSources = request.sources.collect { new File(it.private).toPath().toAbsolutePath().normalize() }.toSet()
def eventFile = new File(request.events)
def sha = { File file -> MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString() }
def path = { File file -> file.absolutePath }
def started = false
def observed = false
def sequence = 0
def emit = { Map value ->
    synchronized (eventFile) {
        assert sequence < 1024
        value.schema = 1
        value.nonce = request.nonce
        value.sequence = sequence++
        value.task = request.task
        eventFile.append(JsonOutput.toJson(value) + '\n', 'UTF-8')
    }
}
def recipe = { JavaCompile task ->
    def compiler = task.javaCompiler.get()
    [javaHome: compiler.metadata.installationPath.asFile.absolutePath,
     compilerExecutable: compiler.executablePath.asFile.absolutePath,
     languageVersion: compiler.metadata.languageVersion.toString(),
     runtimeVersion: compiler.metadata.javaRuntimeVersion,
     sourceCompatibility: task.sourceCompatibility,
     targetCompatibility: task.targetCompatibility,
     release: task.options.release.orNull, encoding: task.options.encoding,
     fork: task.options.fork, forkJavaHome: task.options.forkOptions.javaHome?.absolutePath,
     forkExecutable: task.options.forkOptions.executable, forkJvmArgs: task.options.forkOptions.jvmArgs,
     compilerArguments: task.options.allCompilerArgs,
     compilerArgumentProviders: task.options.compilerArgumentProviders.collect { provider ->
         [type: provider.class.name, arguments: provider.asArguments().toList()]
     },
     annotationProcessors: task.options.annotationProcessorPath.files.collect { file -> [path: path(file), sha256: sha(file)] },
     sources: task.source.files.sort { it.absolutePath }.collect { file -> [path: path(file), sha256: sha(file)] },
     classpath: task.classpath.files.collect(path), destination: path(task.destinationDirectory.get().asFile)]
}
def manager = gradle.services.get(BuildOperationListenerManager)
def listener = [
    started: { descriptor, event -> },
    progress: { identifier, event ->
        if (!started) return
        def details = event.details
        if (!details.class.interfaces.any { it.name == 'org.gradle.api.problems.internal.ProblemProgressDetails' }) return
        def problem = details.problem
        def fileLocations = problem.originLocations.findAll { location ->
            location.metaClass.respondsTo(location, 'getPath')
        }
        def locations = fileLocations.findAll { location ->
            selectedSources.contains(new File(location.path).toPath().toAbsolutePath().normalize())
        }.collect { location ->
            [type: location.class.name, path: location.path,
             line: location.metaClass.respondsTo(location, 'getLine') ? location.line : null,
             column: location.metaClass.respondsTo(location, 'getColumn') ? location.column : null]
        }
        emit([event: 'diagnostic', severity: problem.definition.severity.name(),
              code: problem.definition.id.name, message: problem.contextualLabel,
              originFileLocations: fileLocations.size(),
              rawSelectedLocations: fileLocations.count { rawSelectedSources.contains(it.path) },
              selectedLocations: locations.size(),
              originLocationTypes: fileLocations.collect { it.class.name.take(256) }.unique().take(8),
              locations: locations])
    },
    finished: { descriptor, event -> }
] as BuildOperationListener
manager.addListener(listener)
gradle.taskGraph.whenReady { graph ->
    def matches = graph.allTasks.findAll { it.path == request.task }
    if (matches.isEmpty()) return
    assert !observed && matches.size() == 1 && matches[0] instanceof JavaCompile
    def task = matches[0]
    assert path(task.project.rootProject.projectDir) == request.root
    assert path(task.project.projectDir) == request.projectDir
    assert request.expectedRecipe.every { key, value -> recipe(task)[key] == value }
    assert path(gradle.gradleUserHomeDir) == request.gradleUserHome
    assert request.sources.collect { it.original }.sort() == task.source.files.collect(path).sort()
    request.sources.each { source ->
        assert sha(new File(source.original)) == source.originalSha256
        assert sha(new File(source.private)) == source.privateSha256
    }
    observed = true
    emit([event: 'selected', originalRecipe: recipe(task), originalActions: task.actions.collect { it.class.name }])
    task.setSource(task.project.files(request.sources.collect { new File(it.private) }))
    task.destinationDirectory.set(new File(request.classes))
    task.options.generatedSourceOutputDirectory.set(new File(request.generated))
    task.options.headerOutputDirectory.set(new File(request.headers))
    assert gradle.includedBuilds.every { build -> request.includedBuildRoots.any { path(build.projectDir) == it } }
    def main = task.project.extensions.getByName('sourceSets').getByName('main')
    for (language in ['groovy', 'kotlin', 'scala']) {
        def sources = main.extensions.findByName(language)
        assert sources == null || sources.files.isEmpty()
    }
    assert main.java.srcDirs.collect(path).sort() == request.sourceRoots.collect { it.original }.sort()
    main.java.setSrcDirs(request.sourceRoots.collect { new File(it.private) })
    assert main.output.classesDirs.files.every { directory ->
        path(directory) == request.expectedRecipe.destination || !directory.exists() ||
            (directory.isDirectory() && directory.listFiles() != null && directory.listFiles().length == 0)
    }
    main.output.classesDirs.setFrom(task.project.files(new File(request.classes)))
    // Custom source roots need modeled resource reads before their output can enter the archive.
    def resourceRoot = new File(task.project.projectDir, 'src/main/resources')
    assert main.resources.srcDirs.collect(path) == [path(resourceRoot)]
    def resources = task.project.tasks.getByName(main.processResourcesTaskName)
    assert resources.class.name == 'org.gradle.language.jvm.tasks.ProcessResources_Decorated'
    assert resources.source.files.every { it.toPath().startsWith(resourceRoot.toPath()) }
    resources.destinationDir = new File(request.resourcesRoot)
    main.output.resourcesDir = new File(request.resourcesRoot)
    resources.outputs.upToDateWhen { false }
    resources.outputs.cacheIf { false }
    def metadataAdapters = [
        'gradlebuild.kotlin.tasks.ParameterNamesIndex_Decorated':'destinationFile',
        'gradlebuild.basics.tasks.ClasspathManifest_Decorated':'manifestFile'
    ]
    def metadataRoots = []
    graph.allTasks.findAll { it.project == task.project }.each { candidate ->
        def propertyName = metadataAdapters[candidate.class.name]
        if (propertyName == null) return
        def output = candidate.property(propertyName)
        def directory = new File(request.metadataRoot, candidate.name)
        output.set(new File(directory, output.get().asFile.name))
        metadataRoots.add(directory)
        candidate.outputs.upToDateWhen { false }
        candidate.outputs.cacheIf { false }
        candidate.doFirst {
            if (propertyName == 'destinationFile') {
                assert candidate.sources.files.every { file -> request.sourceRoots.any { file.toPath().startsWith(new File(it.private).toPath()) } }
                assert candidate.classpath.files.any { path(it) == request.classes }
            }
            emit([event:'metadata-start', taskPath:candidate.path, type:candidate.class.name,
                  destination:path(output.get().asFile)])
        }
        candidate.doLast {
            emit([event:'metadata-finish', taskPath:candidate.path, type:candidate.class.name,
                  destination:path(output.get().asFile), sha256:sha(output.get().asFile)])
        }
    }
    def jar = task.project.tasks.getByName('jar')
    assert jar.class.name == 'org.gradle.api.tasks.bundling.Jar_Decorated'
    jar.destinationDirectory.set(new File(request.jarDirectory))
    jar.archiveFileName.set('producer.jar')
    jar.outputs.upToDateWhen { false }
    jar.outputs.cacheIf { false }
    def archiveSources = {
        def manifest = new File(jar.temporaryDir, 'MANIFEST.MF')
        def files = jar.source.files
        def classes = files.findAll { it.name.endsWith('.class') }
        assert !classes.isEmpty() && classes.every { it.toPath().startsWith(new File(request.classes).toPath()) }
        assert files.every { file ->
            file == manifest || [new File(request.classes), new File(request.resourcesRoot)].plus(metadataRoots)
                .any { file.toPath().startsWith(it.toPath()) }
        }
        files.sort { it.absolutePath }.collect { file -> [path:path(file),sha256:sha(file)] }
    }
    jar.doFirst {
        emit([event:'archive-start', taskPath:jar.path, sources:archiveSources(),
              destination:path(jar.archiveFile.get().asFile)])
    }
    jar.doLast {
        emit([event:'archive-finish', taskPath:jar.path, sources:archiveSources(),
              destination:path(jar.archiveFile.get().asFile), sha256:sha(jar.archiveFile.get().asFile)])
    }
    task.outputs.upToDateWhen { false }
    task.outputs.cacheIf { false }
    task.doFirst {
        started = true
        emit([event: 'compiler-start', recipe: recipe(task)])
    }
    task.doLast {
        def files = []
        new File(request.classes).eachFileRecurse { file ->
            if (file.isFile()) files.add([path: path(file), bytes: file.length(), sha256: sha(file)])
        }
        emit([event: 'compiler-finish', recipe: recipe(task), files: files])
    }
}
gradle.taskGraph.afterTask { task, state ->
    if (observed && task.path == request.task) emit([event: 'task-end', executed: state.executed,
        didWork: state.didWork, skipped: state.skipped, noSource: state.noSource,
        upToDate: state.upToDate, failure: state.failure?.toString()])
}
gradle.buildFinished { result ->
    if (observed) emit([event: 'build-end', failure: result.failure?.toString()])
    manager.removeListener(listener)
}
