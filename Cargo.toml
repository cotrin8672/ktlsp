[workspace]
members = ["crates/ktlsp", "crates/ktcore", "crates/ktcheck"]
default-members = ["crates/ktlsp", "crates/ktcore", "crates/ktcheck"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync", "time"] }
tower-lsp-server = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.24"
tree-sitter-java = "0.23"
# Fork fixes automatic semicolon insertion before a bare primary constructor on the next line,
# parses generic calls with value arguments as calls (not comparison chains), and supports
# context parameters (KEEP-0259).
# Preserve the existing syntax fixes while including upstream scanner PR #11.
tree-sitter-kotlin-ng = { git = "https://github.com/cotrin8672/tree-sitter-kotlin", rev = "9fcb964bf2aed03aea770f54809d8a8d9a8e3311" }
ureq = { version = "3", features = ["rustls"] }
walkdir = "2"
zip = { version = "9.1.1", default-features = false, features = ["deflate"] }
toml = "1"
bincode = "1"
sha2 = "0.10"
base64 = "0.22.1"
noak = "=0.7.0"
salsa = "0.28"
zstd = "0.13"
parking_lot = "0.12"

[patch.crates-io]
ls-types = { path = "vendor/ls-types" }
notify = { path = "vendor/notify" }

[profile.dev]
# Keep workspace panic file/line information without generating debugger variable/type data.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
