# Standalone manifest materialized from notify 8.2.0 at the pin in UPSTREAM.md.
# Runtime version constraints/features/target backends are unchanged.
[package]
name = "notify"
version = "8.2.0"
description = "Cross-platform filesystem notification library"
documentation = "https://docs.rs/notify"
readme = "README.md"
license = "CC0-1.0"
keywords = ["events", "filesystem", "notify", "watch"]
categories = ["filesystem"]
authors = [
  "Félix Saparelli <me@passcod.name>",
  "Daniel Faust <hessijames@gmail.com>",
  "Aron Heinecke <Ox0p54r36@t-online.de>"
]
rust-version = "1.77"
edition = "2021"
homepage = "https://github.com/notify-rs/notify"
repository = "https://github.com/notify-rs/notify.git"

# Keep vendor tests independent from the ktlsp workspace test membership.
[workspace]

[features]
default = ["macos_fsevent"]
serde = ["notify-types/serde"]
macos_kqueue = ["kqueue", "mio"]
macos_fsevent = ["fsevent-sys"]
serialization-compat-6 = ["notify-types/serialization-compat-6"]

[dependencies]
notify-types = "2.0.0"
crossbeam-channel = { version = "0.5.0", optional = true }
flume = { version = "0.11.1", optional = true }
libc = "0.2.4"
log = "0.4.17"
walkdir = "2.4.0"

[target.'cfg(any(target_os="linux", target_os="android"))'.dependencies]
inotify = { version = "0.11.0", default-features = false }
mio = { version = "1.0", features = ["os-ext"] }

[target.'cfg(target_os="macos")'.dependencies]
bitflags = "2.7.0"
fsevent-sys = { version = "4.0.0", optional = true }
kqueue = { version = "1.1.1", optional = true }
mio = { version = "1.0", features = ["os-ext"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.1", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_WindowsProgramming", "Win32_System_IO"] }

[target.'cfg(any(target_os="freebsd", target_os="openbsd", target_os = "netbsd", target_os = "dragonflybsd", target_os = "ios"))'.dependencies]
kqueue = "1.1.1"
mio = { version = "1.0", features = ["os-ext"] }

# Preserve the upstream test dependency declarations; do not silently remove test coverage.
[dev-dependencies]
serde_json = "1.0.39"
tempfile = "3.10.0"
nix = "0.29.0"
insta = "1.34.0"

[target.'cfg(target_os = "windows")'.dev-dependencies]
trash = "5.2.2"
